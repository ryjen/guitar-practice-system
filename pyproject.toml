[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guitar-practice-system"
version = "0.1.0"
description = "Deterministic, local-first guitar practice and backing-track system"
requires-python = ">=3.12"

[project.scripts]
guitarctl = "guitar_practice.interfaces.cli.main:main"

[tool.setuptools.packages.find]
include = ["guitar_practice*"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["generated"]

[tool.ruff.lint]
# Keep the first static-analysis gate intentionally narrow: Pyflakes catches
# undefined/unused names and import defects; E9 covers parser/runtime syntax
# failures without introducing style-only churn.
select = ["F", "E9"]
