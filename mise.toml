# Nix owns toolchain versions and reproducible validation.
# mise is only a task entrypoint; no duplicated [tools] versions.
[tasks.test]
description = "Run the canonical guitarctl repository validation in the Nix shell"
run = "nix develop --command guitarctl validate repo"

[tasks.check]
description = "Run all pinned Nix flake checks"
run = "nix flake check --no-write-lock-file --print-build-logs"
