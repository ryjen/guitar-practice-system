name: Validate Repository

on:
  pull_request:
    paths:
      - "catalogs/**"
      - "contracts/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "catalogs/**"
      - "contracts/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run canonical repository validation
        run: python scripts/validate_repo.py
