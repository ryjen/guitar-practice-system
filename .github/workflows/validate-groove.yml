name: Validate Groove and Bass

on:
  pull_request:
    paths:
      - "catalogs/grooves/**"
      - "docs/groove-catalog.md"
      - "docs/groove-engine.md"
      - "docs/bass-engine.md"
      - "guitar_practice/application/groove.py"
      - "guitar_practice/domain/groove.py"
      - "guitar_practice/domain/bass.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_groove_catalog.py"
      - "tests/test_groove_engine.py"
      - "tests/test_bass_engine.py"
      - "tests/test_native_groove_cli.py"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "pyproject.toml"
      - ".github/workflows/validate-groove.yml"
  push:
    branches:
      - main
    paths:
      - "catalogs/grooves/**"
      - "docs/groove-catalog.md"
      - "docs/groove-engine.md"
      - "docs/bass-engine.md"
      - "guitar_practice/application/groove.py"
      - "guitar_practice/domain/groove.py"
      - "guitar_practice/domain/bass.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_groove_catalog.py"
      - "tests/test_groove_engine.py"
      - "tests/test_bass_engine.py"
      - "tests/test_native_groove_cli.py"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "pyproject.toml"
      - ".github/workflows/validate-groove.yml"

permissions:
  contents: read

concurrency:
  group: validate-groove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: guitarctl validate public-boundary > /tmp/public-boundary.json
      - name: Run groove, bass, and backing compatibility tests
        run: |
          python -m unittest tests.test_groove_catalog -v
          python -m unittest tests.test_groove_engine -v
          python -m unittest tests.test_bass_engine -v
          python -m unittest tests.test_native_groove_cli -v
          python -m unittest tests.test_backing_track_engine -v
          python -m unittest tests.test_backing_track_request -v
      - name: Smoke-test groove catalog CLI
        run: |
          guitarctl groove validate > /tmp/groove-validate.json
          guitarctl groove list > /tmp/groove-list.json
          guitarctl groove show jazz-swing > /tmp/groove-show.json
          python -m json.tool /tmp/groove-list.json >/dev/null
          python -m json.tool /tmp/groove-show.json >/dev/null
