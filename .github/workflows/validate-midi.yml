name: Validate MIDI

on:
  pull_request:
    paths:
      - "backing-tracks/**"
      - "catalogs/grooves/**"
      - "catalogs/practice-data.json"
      - "contracts/backing-tracks/**"
      - "docs/backing-track-form.md"
      - "docs/backing-track-request.md"
      - "docs/bass-engine.md"
      - "docs/practice-progression-variants.md"
      - "docs/groove-engine.md"
      - "docs/groove-catalog.md"
      - "examples/backing-tracks/**"
      - "scripts/backing_track_engine.py"
      - "scripts/bass_engine.py"
      - "scripts/build_practice_artifacts.py"
      - "scripts/export_practice_data.py"
      - "scripts/groove_engine.py"
      - "scripts/groove_catalog.py"
      - "scripts/generate_backing_tracks.py"
      - "scripts/generate_practice_progression.py"
      - "scripts/midi_workflow.py"
      - "scripts/resolve_backing_track_request.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "tests/test_bass_engine.py"
      - "tests/test_build_practice_artifacts.py"
      - "tests/test_groove_engine.py"
      - "tests/test_groove_catalog.py"
      - "tests/test_generate_backing_tracks.py"
      - "tests/test_midi_workflow.py"
      - "tests/test_practice_progression.py"
      - ".github/workflows/validate-midi.yml"
  push:
    branches:
      - main
    paths:
      - "backing-tracks/**"
      - "catalogs/grooves/**"
      - "catalogs/practice-data.json"
      - "contracts/backing-tracks/**"
      - "docs/backing-track-form.md"
      - "docs/backing-track-request.md"
      - "docs/bass-engine.md"
      - "docs/practice-progression-variants.md"
      - "docs/groove-engine.md"
      - "docs/groove-catalog.md"
      - "examples/backing-tracks/**"
      - "scripts/backing_track_engine.py"
      - "scripts/bass_engine.py"
      - "scripts/build_practice_artifacts.py"
      - "scripts/export_practice_data.py"
      - "scripts/groove_engine.py"
      - "scripts/groove_catalog.py"
      - "scripts/generate_backing_tracks.py"
      - "scripts/generate_practice_progression.py"
      - "scripts/midi_workflow.py"
      - "scripts/resolve_backing_track_request.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "tests/test_bass_engine.py"
      - "tests/test_build_practice_artifacts.py"
      - "tests/test_groove_engine.py"
      - "tests/test_groove_catalog.py"
      - "tests/test_generate_backing_tracks.py"
      - "tests/test_midi_workflow.py"
      - "tests/test_practice_progression.py"
      - ".github/workflows/validate-midi.yml"

permissions:
  contents: read

concurrency:
  group: validate-midi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce public boundary
        run: python scripts/check_public_boundary.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate groove catalog
        run: python scripts/groove_catalog.py validate
      - name: Resolve backing-track request example
        run: |
          python scripts/resolve_backing_track_request.py \
            examples/backing-tracks/funk-wah-request.json \
            --output /tmp/funk-wah-spec.json
          python - <<'PY'
          import json
          from pathlib import Path

          spec = json.loads(Path("/tmp/funk-wah-spec.json").read_text())
          assert spec["id"] == "funk-wah-pocket-em-96"
          assert [track["role"] for track in spec["tracks"]] == ["drums", "bass"]
          assert spec["tracks"][1]["bass"]["style"] == "kick-root-octave"
          assert spec["sections"][0]["bars"] == 8
          PY
      - name: Generate practice progression example
        run: |
          python scripts/generate_practice_progression.py \
            examples/backing-tracks/funk-wah-request.json \
            --output-dir /tmp/funk-wah-progression \
            --render-midi
          python - <<'PY'
          import json
          from pathlib import Path

          progression = json.loads(Path("/tmp/funk-wah-progression/progression.json").read_text())
          assert progression["profile"] == "tempo-space-v1"
          assert [stage["tempo_bpm"] for stage in progression["stages"]] == [75, 82, 96]
          assert all((Path("/tmp/funk-wah-progression") / stage["spec"]["outputs"]["midi"]).exists() for stage in progression["stages"])
          PY
      - name: Generate and validate backing-track catalog
        run: python scripts/generate_backing_tracks.py
      - name: Validate legacy MIDI entry point
        run: |
          python scripts/midi_workflow.py generate \
            backing-tracks/slide-slow-blues/manifest.json \
            generated/backing-tracks/slide-slow-blues-a-60.mid
      - name: Build deterministic practice bundle
        run: |
          python scripts/build_practice_artifacts.py \
            --source-sha "${{ github.sha }}" \
            --output-dir generated/practice-bundle
      - name: Verify reproducible bundle
        run: |
          python scripts/build_practice_artifacts.py \
            --source-sha "${{ github.sha }}" \
            --output-dir generated/practice-bundle-replay
          diff -qr generated/practice-bundle generated/practice-bundle-replay
