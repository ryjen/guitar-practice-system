name: Validate Pages Frontend

on:
  pull_request:
    paths:
      - "catalogs/practice-data.json"
      - "docs/index.html"
      - "docs/assets/**"
      - "docs/data/**"
      - "docs/.nojekyll"
      - "guitar_practice/adapters/json_values.py"
      - "guitar_practice/adapters/workspace_tree.py"
      - "guitar_practice/application/practice_data_export.py"
      - "guitar_practice/domain/practice_data.py"
      - "guitar_practice/interfaces/cli/operational_handlers.py"
      - "tests/test_pages_frontend.py"
      - "tests/test_practice_data_export.py"
      - ".github/workflows/validate-pages.yml"
  push:
    branches:
      - main
    paths:
      - "catalogs/practice-data.json"
      - "docs/index.html"
      - "docs/assets/**"
      - "docs/data/**"
      - "docs/.nojekyll"
      - "guitar_practice/adapters/json_values.py"
      - "guitar_practice/adapters/workspace_tree.py"
      - "guitar_practice/application/practice_data_export.py"
      - "guitar_practice/domain/practice_data.py"
      - "guitar_practice/interfaces/cli/operational_handlers.py"
      - "tests/test_pages_frontend.py"
      - "tests/test_practice_data_export.py"
      - ".github/workflows/validate-pages.yml"

permissions:
  contents: read

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enforce public boundary
        run: guitarctl validate public-boundary > /tmp/public-boundary.json
      - name: Validate practice data export is current
        run: guitarctl export practice-data --check > /tmp/practice-data-export.json
      - name: Run frontend contract tests
        run: python -m unittest discover -s tests -p "test_pages_frontend.py" -v
      - name: Run practice data export tests
        run: python -m unittest discover -s tests -p "test_practice_data_export.py" -v
      - name: Check JavaScript syntax
        run: node --check docs/assets/app.js
