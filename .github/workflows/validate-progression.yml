name: Validate Progression and Timing

on:
  pull_request:
    paths:
      - "catalogs/progressions/**"
      - "docs/progression-catalog.md"
      - "docs/modal-progressions.md"
      - "examples/musical-dimensions/**"
      - "guitar_practice/application/progression.py"
      - "guitar_practice/domain/progression.py"
      - "guitar_practice/domain/timing.py"
      - "guitar_practice/interfaces/cli/**"
      - "scripts/progression_catalog.py"
      - "scripts/timing.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_progression_catalog.py"
      - "tests/test_modal_progressions.py"
      - "tests/test_timing.py"
      - "tests/test_native_progression_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-progression.yml"
  push:
    branches:
      - main
    paths:
      - "catalogs/progressions/**"
      - "docs/progression-catalog.md"
      - "docs/modal-progressions.md"
      - "examples/musical-dimensions/**"
      - "guitar_practice/application/progression.py"
      - "guitar_practice/domain/progression.py"
      - "guitar_practice/domain/timing.py"
      - "guitar_practice/interfaces/cli/**"
      - "scripts/progression_catalog.py"
      - "scripts/timing.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_progression_catalog.py"
      - "tests/test_modal_progressions.py"
      - "tests/test_timing.py"
      - "tests/test_native_progression_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-progression.yml"

permissions:
  contents: read

concurrency:
  group: validate-progression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: python scripts/check_public_boundary.py
      - name: Run progression and timing tests
        run: |
          python -m unittest tests.test_progression_catalog -v
          python -m unittest tests.test_modal_progressions -v
          python -m unittest tests.test_timing -v
          python -m unittest tests.test_native_progression_cli -v
      - name: Compare progression shim and native CLI
        run: |
          python scripts/progression_catalog.py resolve jazz-blues-12 C > /tmp/progression-shim.json
          guitarctl progression resolve jazz-blues-12 C > /tmp/progression-native.json
          cmp /tmp/progression-shim.json /tmp/progression-native.json

          python scripts/progression_catalog.py fourths \
            progression-jazz-major-ii-v-i --start-key A --count 4 \
            > /tmp/fourths-shim.json
          guitarctl progression fourths \
            progression-jazz-major-ii-v-i --start-key A --count 4 \
            > /tmp/fourths-native.json
          cmp /tmp/fourths-shim.json /tmp/fourths-native.json

          python scripts/progression_catalog.py show jazz-blues-12 > /tmp/show-shim.json
          guitarctl progression show jazz-blues-12 > /tmp/show-native.json
          cmp /tmp/show-shim.json /tmp/show-native.json
      - name: Compare validate and list text contracts
        run: |
          test "$(python scripts/progression_catalog.py validate)" = "$(guitarctl progression validate)"
          test "$(python scripts/progression_catalog.py list)" = "$(guitarctl progression list)"
