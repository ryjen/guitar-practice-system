name: Validate Progression and Timing

on:
  pull_request:
    paths:
      - "catalogs/progressions/**"
      - "docs/progression-catalog.md"
      - "docs/modal-progressions.md"
      - "examples/musical-dimensions/**"
      - "guitar_practice/application/progression.py"
      - "guitar_practice/domain/progression.py"
      - "guitar_practice/domain/timing.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_progression_catalog.py"
      - "tests/test_modal_progressions.py"
      - "tests/test_timing.py"
      - "tests/test_native_progression_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-progression.yml"
  push:
    branches:
      - main
    paths:
      - "catalogs/progressions/**"
      - "docs/progression-catalog.md"
      - "docs/modal-progressions.md"
      - "examples/musical-dimensions/**"
      - "guitar_practice/application/progression.py"
      - "guitar_practice/domain/progression.py"
      - "guitar_practice/domain/timing.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_progression_catalog.py"
      - "tests/test_modal_progressions.py"
      - "tests/test_timing.py"
      - "tests/test_native_progression_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-progression.yml"

permissions:
  contents: read

concurrency:
  group: validate-progression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: guitarctl validate public-boundary > /tmp/public-boundary.json
      - name: Run progression and timing tests
        run: |
          python -m unittest discover -s tests -p 'test_progression_catalog.py' -v
          python -m unittest discover -s tests -p 'test_modal_progressions.py' -v
          python -m unittest discover -s tests -p 'test_timing.py' -v
          python -m unittest discover -s tests -p 'test_native_progression_cli.py' -v
      - name: Smoke-test progression CLI
        run: |
          guitarctl progression validate
          guitarctl progression list > /tmp/progression-list.json
          guitarctl progression resolve jazz-blues-12 C > /tmp/progression.json
          guitarctl progression fourths \
            progression-jazz-major-ii-v-i --start-key A --count 4 \
            > /tmp/fourths.json
          guitarctl progression show jazz-blues-12 > /tmp/show.json
          python -m json.tool /tmp/progression.json >/dev/null
          python -m json.tool /tmp/fourths.json >/dev/null
          python -m json.tool /tmp/show.json >/dev/null
