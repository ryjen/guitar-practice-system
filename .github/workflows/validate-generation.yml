name: Validate Generation

on:
  pull_request:
    paths:
      - "backing-tracks/**"
      - "catalogs/grooves/**"
      - "catalogs/progressions/**"
      - "midi/exercises.json"
      - "guitar_practice/application/generation.py"
      - "guitar_practice/application/ports.py"
      - "guitar_practice/adapters/json_files.py"
      - "guitar_practice/domain/midi_exercises.py"
      - "guitar_practice/domain/practice_progression.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_generate_backing_tracks.py"
      - "tests/test_practice_progression.py"
      - "tests/test_midi_exercises.py"
      - "tests/test_native_generation_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-generation.yml"
  push:
    branches:
      - main
    paths:
      - "backing-tracks/**"
      - "catalogs/grooves/**"
      - "catalogs/progressions/**"
      - "midi/exercises.json"
      - "guitar_practice/application/generation.py"
      - "guitar_practice/application/ports.py"
      - "guitar_practice/adapters/json_files.py"
      - "guitar_practice/domain/midi_exercises.py"
      - "guitar_practice/domain/practice_progression.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_generate_backing_tracks.py"
      - "tests/test_practice_progression.py"
      - "tests/test_midi_exercises.py"
      - "tests/test_native_generation_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-generation.yml"

permissions:
  contents: read

concurrency:
  group: validate-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: guitarctl validate public-boundary > /tmp/public-boundary.json
      - name: Run generation tests
        run: |
          python -m unittest tests.test_generate_backing_tracks -v
          python -m unittest tests.test_practice_progression -v
          python -m unittest tests.test_midi_exercises -v
          python -m unittest tests.test_native_generation_cli -v
      - name: Verify deterministic bulk backing replay
        run: |
          rm -rf generated/backing-tracks /tmp/backing-first-dir
          guitarctl backing generate > /tmp/backing-first.json
          cp -a generated/backing-tracks /tmp/backing-first-dir
          rm -rf generated/backing-tracks
          guitarctl backing generate > /tmp/backing-replay.json
          cmp /tmp/backing-first.json /tmp/backing-replay.json
          diff -qr /tmp/backing-first-dir generated/backing-tracks
      - name: Verify deterministic practice progression replay
        run: |
          guitarctl progression generate \
            examples/backing-tracks/funk-wah-request.json \
            > /tmp/progression-first.json
          guitarctl progression generate \
            examples/backing-tracks/funk-wah-request.json \
            > /tmp/progression-replay.json
          cmp /tmp/progression-first.json /tmp/progression-replay.json

          rm -rf /tmp/progression-first /tmp/progression-replay
          guitarctl progression generate \
            examples/backing-tracks/funk-wah-request.json \
            --output-dir /tmp/progression-first \
            --render-midi > /tmp/progression-first.out
          guitarctl progression generate \
            examples/backing-tracks/funk-wah-request.json \
            --output-dir /tmp/progression-replay \
            --render-midi > /tmp/progression-replay.out
          test "$(cat /tmp/progression-first.out)" = "/tmp/progression-first"
          test "$(cat /tmp/progression-replay.out)" = "/tmp/progression-replay"
          diff -qr /tmp/progression-first /tmp/progression-replay
      - name: Verify deterministic starter MIDI replay
        run: |
          rm -rf generated/midi /tmp/exercises-first-dir
          guitarctl midi generate-exercises > /tmp/exercises-first.txt
          cp -a generated/midi /tmp/exercises-first-dir
          rm -rf generated/midi
          guitarctl midi generate-exercises > /tmp/exercises-replay.txt
          cmp /tmp/exercises-first.txt /tmp/exercises-replay.txt
          diff -qr /tmp/exercises-first-dir generated/midi
