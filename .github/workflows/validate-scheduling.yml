name: Validate Scheduling

on:
  pull_request:
    paths:
      - "contracts/scheduling/**"
      - "docs/scheduling/**"
      - "examples/scheduling/**"
      - "guitar_practice/**"
      - "scripts/scheduling.py"
      - "scripts/scheduling_v2.py"
      - "scripts/assessment_core.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_scheduling*.py"
      - "tests/test_cli_architecture.py"
      - "pyproject.toml"
      - ".github/workflows/validate-scheduling.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/scheduling/**"
      - "docs/scheduling/**"
      - "examples/scheduling/**"
      - "guitar_practice/**"
      - "scripts/scheduling.py"
      - "scripts/scheduling_v2.py"
      - "scripts/assessment_core.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_scheduling*.py"
      - "tests/test_cli_architecture.py"
      - "pyproject.toml"
      - ".github/workflows/validate-scheduling.yml"

permissions:
  contents: read

concurrency:
  group: validate-scheduling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: python scripts/check_public_boundary.py
      - name: Run scheduling tests
        run: python -m unittest discover -s tests -p 'test_scheduling*.py' -v
      - name: Generate v1 deterministic proposal
        run: |
          python scripts/scheduling.py propose \
            examples/scheduling/example-snapshot.json \
            > /tmp/schedule-v1.json
          python - <<'PY'
          import json
          from pathlib import Path

          proposal = json.loads(Path("/tmp/schedule-v1.json").read_text())
          assert proposal["status"] == "complete"
          assert proposal["requires_approval"] is True
          assert [item["item_id"] for item in proposal["selected"]] == ["ebow-foundations", "slide-foundations"]
          assert sum(item["minutes"] for item in proposal["selected"]) == 30
          PY
      - name: Generate v2 proposal through compatibility shim
        run: |
          python scripts/scheduling_v2.py propose \
            examples/scheduling/v2-example-snapshot.json \
            > /tmp/schedule-v2-shim.json
      - name: Generate v2 proposal through guitarctl
        run: |
          guitarctl schedule propose \
            examples/scheduling/v2-example-snapshot.json \
            > /tmp/schedule-v2.json
          python - <<'PY'
          import json
          from pathlib import Path

          native = json.loads(Path("/tmp/schedule-v2.json").read_text())
          shim = json.loads(Path("/tmp/schedule-v2-shim.json").read_text())
          assert native == shim
          assert native["contract_version"] == "scheduling/v2"
          assert native["status"] == "complete"
          assert native["requires_approval"] is True
          assert [item["item_id"] for item in native["selected"]] == ["ebow-foundations", "slide-foundations"]
          assert [item["work_kind"] for item in native["selected"]] == ["maintenance", "development"]
          assert sum(item["minutes"] for item in native["selected"]) == 30
          PY
      - name: Verify v2 approval replay through guitarctl
        run: |
          guitarctl schedule check-approval \
            /tmp/schedule-v2.json \
            examples/scheduling/v2-example-snapshot.json \
            > /tmp/approval-v2.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/approval-v2.json").read_text())
          assert result == {"status": "valid", "reasons": []}
          PY
