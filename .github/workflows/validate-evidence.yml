name: Validate Evidence

on:
  pull_request:
    paths:
      - "docs/evidence/**"
      - "docs/assessment/**"
      - "examples/evidence/**"
      - "examples/assessment/**"
      - "templates/evidence.json"
      - "templates/assessment-*.json"
      - "scripts/evidence_feedback.py"
      - "scripts/assessment_core.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_evidence_feedback*.py"
      - "tests/test_assessment_core.py"
      - ".github/workflows/validate-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "docs/evidence/**"
      - "docs/assessment/**"
      - "examples/evidence/**"
      - "examples/assessment/**"
      - "templates/evidence.json"
      - "templates/assessment-*.json"
      - "scripts/evidence_feedback.py"
      - "scripts/assessment_core.py"
      - "scripts/check_public_boundary.py"
      - "tests/test_evidence_feedback*.py"
      - "tests/test_assessment_core.py"
      - ".github/workflows/validate-evidence.yml"

permissions:
  contents: read

concurrency:
  group: validate-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce public boundary
        run: python scripts/check_public_boundary.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Summarize evidence fixture
        run: |
          python scripts/evidence_feedback.py \
            examples/evidence/slide-feedback.json \
            --as-of 2026-08-06 \
            > /tmp/evidence-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/evidence-summary.json").read_text())
          target = result["targets"][0]
          assert result["advisory"] is True
          assert target["target_id"] == "slide-foundations"
          assert target["reliability_eligible"] is True
          assert target["maintenance_status"] == "not-due"
          assert target["requires_approval"] is True
          PY
      - name: Evaluate assessment fixture
        run: |
          python scripts/assessment_core.py \
            examples/assessment/slide-reliable-context.json \
            templates/assessment-gate-set.json \
            > /tmp/assessment.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/assessment.json").read_text())
          assert result["transition_valid"] is True
          assert result["proposed_state"] == "reliable-context"
          assert result["requires_approval"] is True
          assert all(item["outcome"] == "pass" for item in result["gate_results"])
          PY
