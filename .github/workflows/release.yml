name: Publish Practice Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag identity
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run canonical repository validation
        run: guitarctl validate repo > /tmp/repository-validation.json
      - name: Prepare material-change input
        run: |
          mkdir -p generated
          previous_tag="$(git tag --sort=-version:refname --merged "${GITHUB_SHA}" \
            | grep -Fxv "${GITHUB_REF_NAME}" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            git diff --name-only "${previous_tag}" "${GITHUB_SHA}" -- \
              backing-tracks \
              catalogs/grooves \
              catalogs/progressions \
              catalogs/practice-data.json \
              contracts/backing-tracks \
              contracts/progressions \
              contracts/dsp > generated/release-changes.txt
            printf '%s\n' "${previous_tag}" > generated/previous-release-tag.txt
          else
            git ls-files -- \
              backing-tracks \
              catalogs/grooves \
              catalogs/progressions \
              catalogs/practice-data.json \
              contracts/backing-tracks \
              contracts/progressions \
              contracts/dsp > generated/release-changes.txt
            : > generated/previous-release-tag.txt
          fi
      - name: Build and verify deterministic release twice
        run: |
          previous_tag="$(cat generated/previous-release-tag.txt)"
          common_args=(
            --tag "${GITHUB_REF_NAME}"
            --source-sha "${GITHUB_SHA}"
            --changed-paths generated/release-changes.txt
          )
          if [ -n "${previous_tag}" ]; then
            common_args+=(--previous-tag "${previous_tag}")
          fi
          guitarctl release prepare \
            "${common_args[@]}" \
            --output-dir generated/release
          guitarctl release verify \
            --tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --output-dir generated/release
          guitarctl release prepare \
            "${common_args[@]}" \
            --output-dir generated/release-replay
          guitarctl release verify \
            --tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --output-dir generated/release-replay
          diff -qr generated/release generated/release-replay
          archive="guitar-practice-system-${GITHUB_REF_NAME}.tar"
          (cd generated/release && sha256sum -c "${archive}.sha256")

  publish-release:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify tag identity
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Rebuild verified release assets
        run: |
          mkdir -p generated
          previous_tag="$(git tag --sort=-version:refname --merged "${GITHUB_SHA}" \
            | grep -Fxv "${GITHUB_REF_NAME}" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            git diff --name-only "${previous_tag}" "${GITHUB_SHA}" -- \
              backing-tracks \
              catalogs/grooves \
              catalogs/progressions \
              catalogs/practice-data.json \
              contracts/backing-tracks \
              contracts/progressions \
              contracts/dsp > generated/release-changes.txt
          else
            git ls-files -- \
              backing-tracks \
              catalogs/grooves \
              catalogs/progressions \
              catalogs/practice-data.json \
              contracts/backing-tracks \
              contracts/progressions \
              contracts/dsp > generated/release-changes.txt
          fi
          common_args=(
            --tag "${GITHUB_REF_NAME}"
            --source-sha "${GITHUB_SHA}"
            --changed-paths generated/release-changes.txt
          )
          if [ -n "${previous_tag}" ]; then
            common_args+=(--previous-tag "${previous_tag}")
          fi
          guitarctl release prepare \
            "${common_args[@]}" \
            --output-dir generated/release
          guitarctl release verify \
            --tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --output-dir generated/release
          archive="guitar-practice-system-${GITHUB_REF_NAME}.tar"
          (cd generated/release && sha256sum -c "${archive}.sha256")
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release already exists: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          release_dir=generated/release
          archive="guitar-practice-system-${GITHUB_REF_NAME}.tar"
          gh release create "${GITHUB_REF_NAME}" \
            "${release_dir}/${archive}" \
            "${release_dir}/${archive}.sha256" \
            "${release_dir}/RELEASE.md" \
            --verify-tag \
            --title "Guitar Practice System ${GITHUB_REF_NAME}" \
            --notes-file "${release_dir}/RELEASE.md"
