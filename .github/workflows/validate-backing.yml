name: Validate Backing

on:
  pull_request:
    paths:
      - "catalogs/grooves/**"
      - "catalogs/progressions/**"
      - "docs/backing-track-request.md"
      - "docs/modal-progressions.md"
      - "examples/backing-tracks/**"
      - "guitar_practice/application/backing.py"
      - "guitar_practice/domain/backing.py"
      - "guitar_practice/domain/backing_request.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "tests/test_native_backing_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-backing.yml"
  push:
    branches:
      - main
    paths:
      - "catalogs/grooves/**"
      - "catalogs/progressions/**"
      - "docs/backing-track-request.md"
      - "docs/modal-progressions.md"
      - "examples/backing-tracks/**"
      - "guitar_practice/application/backing.py"
      - "guitar_practice/domain/backing.py"
      - "guitar_practice/domain/backing_request.py"
      - "guitar_practice/interfaces/cli/**"
      - "tests/test_backing_track_engine.py"
      - "tests/test_backing_track_request.py"
      - "tests/test_native_backing_cli.py"
      - "pyproject.toml"
      - ".github/workflows/validate-backing.yml"

permissions:
  contents: read

concurrency:
  group: validate-backing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Enforce public boundary
        run: guitarctl validate public-boundary > /tmp/public-boundary.json
      - name: Run backing domain and CLI tests
        run: |
          python -m unittest tests.test_backing_track_engine -v
          python -m unittest tests.test_backing_track_request -v
          python -m unittest tests.test_native_backing_cli -v
      - name: Resolve backing requests through stable CLI
        run: |
          guitarctl backing resolve \
            examples/backing-tracks/funk-wah-request.json \
            > /tmp/backing.json
          guitarctl backing resolve \
            examples/backing-tracks/jazz-blues-12-request.json \
            --output /tmp/backing-output.json
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("/tmp/backing.json").read_text())
          second = json.loads(Path("/tmp/backing-output.json").read_text())
          assert first["id"] == "funk-wah-pocket-em-96"
          assert second["id"] == "jazz-blues-12-c-110"
          PY
